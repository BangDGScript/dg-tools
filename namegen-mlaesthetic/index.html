<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generator Nama ML Aesthetic - Dunia Games</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#161616}*{box-sizing:border-box}body{margin:0;background:transparent}.wrap{max-width:760px;margin:auto;padding:20px 12px}.generator{background:white;border:1px solid #e7e7e7;border-radius:18px;padding:22px;box-shadow:0 5px 22px #00000008}h2{font-size:24px;margin:0 0 6px}.sub{color:#666;font-size:14px;margin:0 0 22px}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:18px}.control.category{grid-column:1/-1}label{font-weight:700;display:block;font-size:14px;margin-bottom:8px}select{width:100%;background:#fff;border:1px solid #d2d2d2;border-radius:9px;padding:13px 12px;font:inherit;color:#151515}.result{border-radius:13px;background:#f7f7f8;padding:25px 12px;text-align:center;margin:10px 0 16px}.hint{font-size:12px;color:#777;margin:0 0 12px}.nickname{font-size:clamp(21px,5vw,34px);font-weight:750;overflow-wrap:anywhere;line-height:1.5;min-height:48px;margin-bottom:14px}.btn{width:100%;border:0;border-radius:10px;padding:15px 16px;font:inherit;font-weight:800;cursor:pointer;transition:filter .15s,transform .15s}.btn:hover{filter:brightness(.93)}.btn:active{transform:scale(.99)}.copy{width:auto;background:white;border:1px solid #ddd;color:#111;padding:10px 18px;font-size:14px}.lucky{background:#e92535;color:white;font-size:19px;padding:19px 16px;margin-bottom:10px}.filtered{background:#111;color:white;font-size:16px}.status{font-size:13px;color:#777;text-align:center;min-height:19px;margin-top:12px}@media(max-width:480px){.generator{padding:16px}.controls{grid-template-columns:1fr}.control.category{grid-column:auto}}
</style>
</head>
<body>
<main class="wrap">
<section class="generator" aria-label="Generator nama ML aesthetic">
<h2>Generator Nama ML Aesthetic</h2>
<p class="sub">Temukan nickname keren dari Inggris, Jepang, atau Korea dengan font dan simbol pilihanmu.</p>
<div class="controls">
<div class="control category"><label for="category">Kategori Nama</label><select id="category"><option>Inggris</option><option>Jepang</option><option>Korea</option></select></div>
<div class="control"><label for="font">Gaya Font</label><select id="font"><option>Normal</option><option>Bold</option><option>Sans Bold</option><option selected>Aesthetic</option><option>Huruf Kecil</option></select></div>
<div class="control"><label for="symbol">Simbol</label><select id="symbol"></select></div>
</div>
<div class="result"><p class="hint">Nickname kamu</p><div id="nickname" class="nickname" aria-live="polite">Klik Tombol di Bawah!</div><button id="copy" class="btn copy" type="button" hidden disabled>⧉ Salin Nama</button></div>
<button id="lucky" class="btn lucky" type="button">🎲 Pilihkan Nama Saya</button>
<button id="filtered" class="btn filtered" type="button">↻ Generate Sesuai Filter</button>
<div id="status" class="status" role="status">Memuat database nama…</div>
</section>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
let db = null, current = '', lastBase = '';
const fonts = ['Normal', 'Bold', 'Sans Bold', 'Aesthetic', 'Huruf Kecil'];
const smallCaps = Object.fromEntries(Array.from('abcdefghijklmnopqrstuvwxyz').map((c, i) => [c, Array.from('ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀꜱᴛᴜᴠᴡxʏᴢ')[i]]));

function fontify(str, mode) {
  if (mode === 'Normal') return str;
  return Array.from(str).map(ch => {
    if (mode === 'Huruf Kecil') return smallCaps[ch.toLowerCase()] || ch;
    const i = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz'.indexOf(ch);
    if (i < 0) return ch;
    const bases = mode === 'Bold' ? [0x1D400, 0x1D41A] : mode === 'Sans Bold' ? [0x1D5D4, 0x1D5EE] : [0x1D63C, 0x1D656];
    return String.fromCodePoint(bases[i < 26 ? 0 : 1] + (i < 26 ? i : i - 26));
  }).join('');
}

function randomInt(n) {
  if (!n) return 0;
  const a = new Uint32Array(1);
  crypto.getRandomValues(a);
  return a[0] % n;
}
function pick(arr) { return arr[randomInt(arr.length)]; }

function loadSymbols() {
  const select = $('symbol');
  select.replaceChildren();
  Object.keys(db.simbol).forEach(nama => select.add(new Option(nama, nama)));
  if (Object.hasOwn(db.simbol, 'Tanpa simbol')) select.value = 'Tanpa simbol';
}

function render() {
  if (!db || !lastBase) return;
  const styled = fontify(lastBase, $('font').value);
  const template = db.simbol[$('symbol').value] || '{nama}';
  current = template.replaceAll('{nama}', styled);
  $('nickname').textContent = current;
}

function generate(lucky = false) {
  if (!db) return;
  if (lucky) {
    $('category').value = pick(Object.keys(db.nama).filter(k => Array.isArray(db.nama[k]) && db.nama[k].length));
    $('font').value = pick(fonts);
    $('symbol').value = pick(Object.keys(db.simbol));
  }
  const pool = db.nama[$('category').value] || [];
  if (!pool.length) { $('status').textContent = 'Belum ada nama pada kategori ini.'; return; }
  let next = pick(pool);
  if (pool.length > 1 && next === lastBase) next = pool[(pool.indexOf(next) + 1) % pool.length];
  lastBase = next;
  render();
  $('copy').hidden = false;
  $('copy').disabled = false;
  $('status').textContent = '';
}

async function copy(value) {
  try {
    await navigator.clipboard.writeText(value);
    $('status').textContent = 'Nama berhasil disalin!';
  } catch {
    const area = document.createElement('textarea');
    area.value = value;
    document.body.append(area);
    area.select();
    const ok = document.execCommand('copy');
    area.remove();
    $('status').textContent = ok ? 'Nama berhasil disalin!' : 'Tidak bisa menyalin otomatis. Silakan pilih dan salin nama secara manual.';
  }
}

$('lucky').addEventListener('click', () => generate(true));
$('filtered').addEventListener('click', () => generate(false));
$('copy').addEventListener('click', () => copy(current));
$('category').addEventListener('change', () => {
  lastBase = '';
  current = '';
  $('nickname').textContent = 'Klik Tombol di Bawah!';
  $('copy').hidden = true;
  $('copy').disabled = true;
});
$('font').addEventListener('change', render);
$('symbol').addEventListener('change', render);

fetch('./names-mlbb.json')
  .then(r => { if (!r.ok) throw Error('HTTP ' + r.status); return r.json(); })
  .then(data => {
    if (!data.nama || typeof data.nama !== 'object' || !data.simbol || typeof data.simbol !== 'object' || !Object.keys(data.simbol).length) {
      throw Error('Format JSON tidak sesuai');
    }
    db = data;
    loadSymbols();
    $('status').textContent = '';
  })
  .catch(err => {
    $('status').textContent = 'Gagal memuat names-mlbb.json. Pastikan file JSON ada di folder yang sama dengan HTML.';
    console.error(err);
  });
</script>
</body>
</html>
