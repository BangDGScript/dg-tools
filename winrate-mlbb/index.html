
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kalkulator Win Rate MLBB - Dunia Games</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #222222;
    }

    .calculator {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 14px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #ffffff;
    }

    .calculator h2 {
      margin: 0 0 5px;
      font-size: 18px;
      line-height: 1.3;
      text-align: center;
    }

    .subtitle {
      margin: 0 0 14px;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
      color: #666666;
    }

    .input-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: bold;
    }

    .field input {
      width: 100%;
      min-width: 0;
      height: 42px;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      background: #ffffff;
      color: #222222;
      font-size: 16px;
      outline: none;
    }

    .field input:focus {
      border-color: #e11d48;
      box-shadow: 0 0 0 2px rgba(225, 29, 72, 0.1);
    }

    .result {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 82px;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
      background: #f8fafc;
      text-align: center;
    }

    .result-label {
      margin-bottom: 4px;
      color: #64748b;
      font-size: 12px;
    }

    .result-value {
      font-size: 30px;
      font-weight: 800;
      line-height: 1.2;
      color: #e11d48;
    }

    .error {
      min-height: 16px;
      margin: 0 0 8px;
      color: #dc2626;
      font-size: 12px;
      text-align: center;
    }

    .button-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 8px;
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 7px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .calculate-btn {
      background: #e11d48;
      color: #ffffff;
    }

    .reset-btn {
      background: #e5e7eb;
      color: #374151;
    }

    button:focus-visible {
      outline: 3px solid #94a3b8;
      outline-offset: 2px;
    }

    @media (max-width: 360px) {
      .calculator {
        padding: 10px;
      }

      .calculator h2 {
        font-size: 16px;
      }

      .field label {
        font-size: 11px;
      }

      .result-value {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <main class="calculator">
    <h2>Kalkulator Win Rate MLBB</h2>

    <p class="subtitle">
      Hitung persentase kemenangan Mobile Legends kamu!
    </p>

    <form id="wr-form" novalidate>

      <div class="input-row">
        <div class="field">
          <label for="matches">Total Match</label>
          <input
            type="number"
            id="matches"
            min="1"
            step="1"
            placeholder="Contoh: 100"
            inputmode="numeric"
            required
          >
        </div>

        <div class="field">
          <label for="wins">Total Win</label>
          <input
            type="number"
            id="wins"
            min="0"
            step="1"
            placeholder="Contoh: 60"
            inputmode="numeric"
            required
          >
        </div>
      </div>

      <div class="result" aria-live="polite">
        <span class="result-label">Win Rate Kamu</span>
        <span class="result-value" id="wr-result">--%</span>
      </div>

      <p class="error" id="error-message" role="alert"></p>

      <div class="button-row">
        <button type="submit" class="calculate-btn">
          Hitung WR
        </button>

        <button type="reset" class="reset-btn">
          Reset
        </button>
      </div>

    </form>
  </main>

  <script>
    (function () {
      "use strict";

      const form = document.getElementById("wr-form");
      const matchesInput = document.getElementById("matches");
      const winsInput = document.getElementById("wins");
      const result = document.getElementById("wr-result");
      const error = document.getElementById("error-message");

      function showError(message) {
        error.textContent = message;
        result.textContent = "--%";
      }

      function calculateWR(event) {
        event.preventDefault();

        error.textContent = "";

        const matchText = matchesInput.value.trim();
        const winText = winsInput.value.trim();

        if (matchText === "" || winText === "") {
          showError("Isi Total Match dan Total Win terlebih dahulu.");
          return;
        }

        const matches = Number(matchText);
        const wins = Number(winText);

        if (
          !Number.isSafeInteger(matches) ||
          !Number.isSafeInteger(wins) ||
          matches <= 0 ||
          wins < 0
        ) {
          showError("Masukkan jumlah match dan win yang valid.");
          return;
        }

        if (wins > matches) {
          showError("Total Win tidak boleh melebihi Total Match.");
          return;
        }

        const winRate = (wins / matches) * 100;

        result.textContent = winRate.toFixed(2) + "%";
      }

      form.addEventListener("submit", calculateWR);

      form.addEventListener("reset", function () {
        result.textContent = "--%";
        error.textContent = "";
      });

      [matchesInput, winsInput].forEach(function (input) {
        input.addEventListener("input", function () {
          error.textContent = "";
          result.textContent = "--%";
        });
      });
    })();
  </script>

</body>
</html>
