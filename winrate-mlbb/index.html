
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalkulator Win Rate Mobile Legends</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      color: #222;
      background: #fff;
    }

    .calculator {
      max-width: 600px;
      margin: auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 12px;
    }

    h2 {
      font-size: 20px;
      margin: 0 0 12px;
    }

    p {
      font-size: 14px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }

    #calculate {
      background: #e53935;
      color: white;
    }

    #reset {
      background: #eee;
      color: #222;
    }

    #result {
      margin-top: 18px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
      text-align: center;
    }

    .percentage {
      font-size: 30px;
      font-weight: bold;
      color: #e53935;
    }

    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <main class="calculator">
    <h2>Kalkulator Win Rate Mobile Legends</h2>
    <p>Masukkan total pertandingan dan jumlah kemenangan untuk menghitung WR kamu.</p>

    <form id="wr-form">
      <label for="matches">Total Match</label>
      <input type="number" id="matches" min="1" step="1" placeholder="Contoh: 500" required>

      <label for="wins">Total Kemenangan</label>
      <input type="number" id="wins" min="0" step="1" placeholder="Contoh: 300" required>

      <div class="buttons">
        <button id="calculate" type="submit">Hitung WR</button>
        <button id="reset" type="reset">Reset</button>
      </div>
    </form>

    <div id="result" role="status" aria-live="polite" hidden>
      <p>Win Rate kamu saat ini:</p>
      <div class="percentage" id="wr-value">0%</div>
    </div>
  </main>

  <script>
    const form = document.getElementById("wr-form");
    const result = document.getElementById("result");
    const wrValue = document.getElementById("wr-value");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const matches = Number(document.getElementById("matches").value);
      const wins = Number(document.getElementById("wins").value);

      if (!Number.isSafeInteger(matches) || matches <= 0 ||
          !Number.isSafeInteger(wins) || wins < 0 || wins > matches) {
        alert("Masukkan jumlah match dan kemenangan yang valid!");
        result.hidden = true;
        return;
      }

      const wr = (wins / matches) * 100;
      wrValue.textContent = wr.toFixed(2) + "%";
      result.hidden = false;
    });

    form.addEventListener("reset", function() {
      result.hidden = true;
    });
  </script>
</body>
</html>
