<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generator Nama ML Anti Mainstream - Dunia Games</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#161616}*{box-sizing:border-box}body{margin:0;background:transparent}.wrap{max-width:760px;margin:auto;padding:20px 12px}.generator{background:#fff;border:1px solid #e7e7e7;border-radius:18px;padding:22px;box-shadow:0 5px 22px #00000008}h2{font-size:24px;margin:0 0 6px}.sub{color:#666;font-size:14px;margin:0 0 22px}.result{border-radius:13px;background:#f7f7f8;padding:25px 12px;text-align:center;margin:10px 0 16px}.hint{font-size:12px;color:#777;margin:0 0 12px}.nickname{font-size:clamp(21px,5vw,34px);font-weight:750;overflow-wrap:anywhere;line-height:1.5;min-height:48px;margin-bottom:14px}.btn{width:100%;border:0;border-radius:10px;padding:15px 16px;font:inherit;font-weight:800;cursor:pointer;transition:filter .15s,transform .15s}.btn:hover{filter:brightness(.93)}.btn:active{transform:scale(.99)}.copy{width:auto;background:#fff;border:1px solid #ddd;color:#111;padding:10px 18px;font-size:14px}.generate{background:#e92535;color:#fff;font-size:19px;padding:19px 16px}.status{font-size:13px;color:#777;text-align:center;min-height:19px;margin-top:12px}@media(max-width:480px){.generator{padding:16px}}
</style>
</head>
<body>
<main class="wrap"><section class="generator" aria-label="Generator nama ML anti mainstream">
<h2>Generator Nama ML Anti Mainstream</h2>
<p class="sub">Cari nickname Mobile Legends unik dan keren secara acak. Tinggal generate, lalu salin nama favoritmu!</p>
<div class="result"><p class="hint">Nickname kamu</p><div id="nickname" class="nickname" aria-live="polite">Klik Tombol di Bawah!</div><button id="copy" class="btn copy" type="button" hidden disabled>⧉ Salin Nama</button></div>
<button id="generate" class="btn generate" type="button" disabled>🎲 Generate Nama Acak</button>
<div id="status" class="status" role="status">Memuat database nama…</div>
</section></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
let names=[],current='',previousIndex=-1;
function randomInt(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function generate(){if(!names.length)return;let i=randomInt(names.length);if(names.length>1&&i===previousIndex)i=(i+1+randomInt(names.length-1))%names.length;previousIndex=i;current=names[i];$('nickname').textContent=current;$('copy').hidden=false;$('copy').disabled=false;$('status').textContent=''}
async function copyName(){if(!current)return;try{await navigator.clipboard.writeText(current);$('status').textContent='Nama berhasil disalin!'}catch{const area=document.createElement('textarea');area.value=current;area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();let ok=false;try{ok=document.execCommand('copy')}catch{}area.remove();$('status').textContent=ok?'Nama berhasil disalin!':'Tidak bisa menyalin otomatis. Silakan salin nama secara manual.'}}
$('generate').addEventListener('click',generate);
$('copy').addEventListener('click',copyName);
fetch('./names-mlantimainstream.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{if(!Array.isArray(data.nama)||!data.nama.length||!data.nama.every(x=>typeof x==='string'))throw Error('Format JSON tidak sesuai');names=data.nama;$('generate').disabled=false;$('status').textContent=''}).catch(err=>{$('status').textContent='Gagal memuat database. Pastikan names-mlantimainstream.json berada di folder yang sama.';console.error(err)});
</script>
</body>
</html>
