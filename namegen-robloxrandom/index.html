<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Nama Roblox Keren Acak - Dunia Games</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 12px;
            background: transparent;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
        }

        .generator {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            padding: 22px;
            border: 1px solid #e5e5e5;
            border-radius: 14px;
            background: #fff;
            text-align: center;
        }

        h2 {
            margin: 0 0 8px;
            font-size: 21px;
        }

        .description {
            margin: 0 0 20px;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }

        .result {
            display: flex;
            min-height: 72px;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            padding: 14px;
            border-radius: 9px;
            background: #f4f4f4;
            font-size: 21px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .generate {
            background: #e62129;
            color: #fff;
        }

        .copy {
            margin-top: 10px;
            background: #ededed;
            color: #222;
        }

        .copy[hidden] {
            display: none;
        }

        .status {
            min-height: 18px;
            margin: 10px 0 0;
            color: #666;
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <main class="generator">
        <h2>Generator Nama Roblox</h2>
        <p class="description">
            Temukan nama Roblox keren, aesthetic, lucu, atau unik barumu secara acak!
        </p>

        <div class="result" id="nickname" aria-live="polite">
            Klik tombol untuk mulai
        </div>

        <button class="generate" id="generate" disabled>
            🎲 Generate Nama Acak
        </button>

        <button class="copy" id="copy" hidden>
            ⧉ Salin Nama
        </button>

        <p class="status" id="status">Memuat daftar nama...</p>
    </main>

    <script>
        'use strict';

        const generateButton = document.getElementById('generate');
        const copyButton = document.getElementById('copy');
        const nicknameElement = document.getElementById('nickname');
        const statusElement = document.getElementById('status');

        let names = [];
        let currentName = '';
        let previousIndex = -1;

        function randomIndex(max) {
            const values = new Uint32Array(1);
            crypto.getRandomValues(values);
            return values[0] % max;
        }

        function generateName() {
            if (names.length === 0) {
                return;
            }

            let index = randomIndex(names.length);

            if (names.length > 1 && index === previousIndex) {
                index = (index + 1 + randomIndex(names.length - 1)) % names.length;
            }

            previousIndex = index;
            currentName = names[index];
            nicknameElement.textContent = currentName;
            copyButton.hidden = false;
            statusElement.textContent = '';
        }

        async function copyName() {
            if (!currentName) {
                return;
            }

            try {
                await navigator.clipboard.writeText(currentName);
                statusElement.textContent = 'Nama berhasil disalin!';
            } catch (error) {
                const input = document.createElement('textarea');
                input.value = currentName;
                input.style.position = 'fixed';
                input.style.opacity = '0';
                document.body.appendChild(input);
                input.select();

                let copied = false;

                try {
                    copied = document.execCommand('copy');
                } catch (fallbackError) {
                    copied = false;
                }

                input.remove();
                statusElement.textContent = copied
                    ? 'Nama berhasil disalin!'
                    : 'Gagal menyalin otomatis. Silakan salin nama secara manual.';
            }
        }

        async function loadNames() {
            try {
                const response = await fetch('./names-roblox.json');

                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }

                const data = await response.json();

                if (!Array.isArray(data.nama) ||
                    data.nama.length === 0 ||
                    !data.nama.every(name => typeof name === 'string')) {
                    throw new Error('Format database tidak valid');
                }

                names = data.nama;
                generateButton.disabled = false;
                statusElement.textContent = '';
            } catch (error) {
                statusElement.textContent =
                    'Gagal memuat nama. Pastikan file JSON ada di folder yang sama.';
                console.error(error);
            }
        }

        generateButton.addEventListener('click', generateName);
        copyButton.addEventListener('click', copyName);
        loadNames();
    </script>
</body>
</html>
