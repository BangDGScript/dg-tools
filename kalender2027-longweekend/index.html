<!doctype html>
<html lang="id">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Kalender Libur Gamers 2027 - Dunia Games
  </title>
  <style>
   :root {
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color:#171717
}

* {
  box-sizing:border-box
}

body {
  margin:0;
  background:transparent
}

.wrap {
  width:100%;
  max-width:360px;
  margin:auto;
  padding:8px
}

.panel {
  border:1px solid #e5e5e5;
  border-radius:16px;
  padding:16px;
  background:#fff
}

h2 {
  font-size:19px;
  margin:0 0 6px
}

.sub {
  font-size:13px;
  color:#666;
  line-height:1.5;
  margin:0 0 16px
}

.nav {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:14px
}

.nav strong {
  font-size:16px
}

.arrow {
  width:36px;
  height:36px;
  border:1px solid #ddd;
  border-radius:9px;
  background:white;
  font-size:22px;
  cursor:pointer
}

.arrow:disabled {
  opacity:.25;
  cursor:default
}

.days {
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:4px
}

.weekday {
  text-align:center;
  font-size:11px;
  color:#777;
  padding:6px 0
}

.day {
  min-width:0;
  aspect-ratio:1;
  border:0;
  border-radius:8px;
  background:transparent;
  font-size:13px;
  font-family:inherit;
  color:#222
}

.day[disabled] {
  cursor:default
}

.day:not([disabled]) {
  cursor:pointer
}

.day.national {
  background:#fbd6db;
  color:#a31428;
  font-weight:700
}

.day.joint {
  background:#d9e9ff;
  color:#1455a5;
  font-weight:700
}

.day.weekend {
  background:#f1f1f1;
  color:#555
}

.day.selected {
  outline:2px solid #202020;
  outline-offset:1px
}

.day:focus-visible,.arrow:focus-visible {
  outline:2px solid #111;
  outline-offset:2px
}

.legend {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:14px 0;
  font-size:11px;
  color:#555
}

.legend span {
  display:flex;
  align-items:center;
  gap:4px
}

.dot {
  width:10px;
  height:10px;
  border-radius:3px;
  display:inline-block
}

.dot.national {
  background:#fbd6db
}

.dot.joint {
  background:#d9e9ff
}

.dot.weekend {
  background:#f1f1f1;
  border:1px solid #ddd
}

.detail {
  border-radius:10px;
  background:#f7f7f8;
  padding:12px;
  font-size:13px;
  line-height:1.5;
  min-height:60px
}

.note {
  font-size:11px;
  color:#777;
  line-height:1.5;
  margin:14px 0 0
}

@media(max-width:340px) {
  .panel {
  padding:12px
}

.days {
  gap:2px
}

.day {
  font-size:12px
}


}
  </style>
 </head>
 <body>
  <main class="wrap">
   <section class="panel">
    <h2>
     Kalender Libur 2027
    </h2>
    <p class="sub">
     Cari tanggal merah dan long weekend!
    </p>
    <div class="nav">
     <button aria-label="Bulan sebelumnya" class="arrow" id="prev" type="button">
      &lsaquo;
     </button>
     <strong id="monthLabel">
     </strong>
     <button aria-label="Bulan berikutnya" class="arrow" id="next" type="button">
      &rsaquo;
     </button>
    </div>
    <div aria-label="Tanggal dalam bulan" class="days" id="days">
    </div>
    <div class="legend">
     <span>
      <i class="dot national">
      </i>
      Libur nasional
     </span>
     <span>
      <i class="dot joint">
      </i>
      Cuti bersama
     </span>
     <span>
      <i class="dot weekend">
      </i>
      Akhir pekan
     </span>
    </div>
    <div aria-live="polite" class="detail" id="detail" role="status">
     Pilih tanggal untuk melihat keterangannya.
    </div>
   </section>
  </main>
  <script>
   "use strict";

// Daftar tanggal menggunakan format MM-DD.
const national = {
    '01-01':'Tahun Baru Masehi',
    '01-05':'Isra Miraj',
    '02-06':'Tahun Baru Imlek',
    '03-08':'Hari Suci Nyepi',
    '03-10':'Idul Fitri 1448 H',
    '03-11':'Idul Fitri 1448 H',
    '03-26':'Wafat Isa Almasih',
    '03-28':'Hari Paskah',
    '05-01':'Hari Buruh Internasional',
    '05-06':'Kenaikan Isa Almasih',
    '05-17':'Idul Adha 1448 H',
    '05-20':'Hari Raya Waisak',
    '06-01':'Hari Lahir Pancasila',
    '06-06':'Tahun Baru Islam',
    '08-15':'Maulid Nabi',
    '08-17':'Hari Kemerdekaan RI',
    '12-25':'Hari Natal',
    '12-26':'Isra Miraj'
};

const joint = {
    '02-05':'Cuti bersama Imlek',
    '03-09':'Cuti bersama Idul Fitri',
    '03-12':'Cuti bersama Idul Fitri',
    '03-15':'Cuti bersama Idul Fitri',
    '03-25':'Cuti bersama Wafat Isa Almasih',
    '05-18':'Cuti bersama Idul Adha',
    '05-19':'Cuti bersama Waisak',
    '12-24':'Cuti bersama Natal'
};

const months = [
  'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
  'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
];
const weekdays = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];

const grid = document.getElementById('days');
const detail = document.getElementById('detail');
const label = document.getElementById('monthLabel');
const prev = document.getElementById('prev');
const next = document.getElementById('next');
let month = 0;

function render() {
  grid.replaceChildren();
  label.textContent = months[month] + ' 2027';
  prev.disabled = month === 0;
  next.disabled = month === 11;
  detail.textContent = 'Pilih tanggal untuk melihat keterangannya.';

  weekdays.forEach(day => {
    const heading = document.createElement('span');
    heading.className = 'weekday';
    heading.textContent = day;
    grid.append(heading);
  });

  const offset = (new Date(2027, month, 1).getDay() + 6) % 7;
  for (let i = 0; i < offset; i++) {
    grid.append(document.createElement('span'));
  }

  const total = new Date(2027, month + 1, 0).getDate();
  for (let day = 1; day <= total; day++) {
    const key = String(month + 1).padStart(2, '0') + '-' +
      String(day).padStart(2, '0');
    const holiday = national[key];
    const leave = joint[key];
    const weekend = [0, 6].includes(new Date(2027, month, day).getDay());

    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'day' + (
      holiday ? ' national' :
      leave ? ' joint' :
      weekend ? ' weekend' : ''
    );
    button.textContent = day;

    const info = holiday ? 'Libur nasional — ' + holiday :
      leave ? 'Cuti bersama — ' + leave :
      weekend ? 'Akhir pekan' : 'Hari biasa';

    button.setAttribute(
      'aria-label',
      day + ' ' + months[month] + ' 2027, ' + info
    );

    button.addEventListener('click', () => {
      grid.querySelectorAll('.selected').forEach(element => {
        element.classList.remove('selected');
      });
      button.classList.add('selected');
      detail.textContent = day + ' ' + months[month] + ' 2027 — ' + info;
    });

    grid.append(button);
  }
}

prev.addEventListener('click', () => {
  if (month > 0) {
    month--;
    render();
  }
});

next.addEventListener('click', () => {
  if (month < 11) {
    month++;
    render();
  }
});

render();
  </script>
 </body>
</html>
